services:
  industrial-instruction-ai:
    build:
      context: .
    image: industrial-instruction-ai:local
    init: true
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-8000}:8000"
    environment:
      DEPLOYMENT_MODE: "${DEPLOYMENT_MODE:-demo}"
      OPENAI_ENABLED: "${OPENAI_ENABLED:-false}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4.1-mini}"
      OPENAI_VISION_MODEL: "${OPENAI_VISION_MODEL:-gpt-4.1-mini}"
      OPENAI_EMBEDDING_MODEL: "${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}"
      OPENAI_TIMEOUT_SECONDS: "${OPENAI_TIMEOUT_SECONDS:-10}"
      VIDEO_MAX_BYTES: "${VIDEO_MAX_BYTES:-262144000}"
      VIDEO_MAX_DURATION_SECONDS: "${VIDEO_MAX_DURATION_SECONDS:-1800}"
      VIDEO_NETWORK_TIMEOUT_SECONDS: "${VIDEO_NETWORK_TIMEOUT_SECONDS:-15}"
      VISION_MAX_KEYFRAMES: "${VISION_MAX_KEYFRAMES:-8}"
      VISION_MAX_IMAGE_BYTES: "${VISION_MAX_IMAGE_BYTES:-5242880}"
      DOCUMENT_MAX_BYTES: "${DOCUMENT_MAX_BYTES:-15728640}"
      DATABASE_PATH: "${DATABASE_PATH:-/app/generated/app.sqlite3}"
      METRICS_DATABASE_PATH: "${METRICS_DATABASE_PATH:-/app/generated/metrics.sqlite3}"
      METRICS_BUCKET_SECONDS: "${METRICS_BUCKET_SECONDS:-60}"
      METRICS_WINDOW_SECONDS: "${METRICS_WINDOW_SECONDS:-300}"
      METRICS_RETENTION_SECONDS: "${METRICS_RETENTION_SECONDS:-604800}"
      METRICS_LATENCY_THRESHOLD_MS: "${METRICS_LATENCY_THRESHOLD_MS:-2000}"
      METRICS_AVAILABILITY_SLO_PERCENT: "${METRICS_AVAILABILITY_SLO_PERCENT:-99}"
      METRICS_LATENCY_SLO_PERCENT: "${METRICS_LATENCY_SLO_PERCENT:-95}"
      METRICS_ALERT_MIN_REQUESTS: "${METRICS_ALERT_MIN_REQUESTS:-20}"
      API_ACCESS_TOKEN: "${API_ACCESS_TOKEN:-}"
      AUTH_PUBLIC_REGISTRATION_ENABLED: "${AUTH_PUBLIC_REGISTRATION_ENABLED:-true}"
      AUTH_ALLOW_ROLE_SELF_ASSIGNMENT: "${AUTH_ALLOW_ROLE_SELF_ASSIGNMENT:-true}"
      AUTH_MIN_PASSWORD_LENGTH: "${AUTH_MIN_PASSWORD_LENGTH:-8}"
      AUTH_SESSION_TTL_SECONDS: "${AUTH_SESSION_TTL_SECONDS:-86400}"
      AUTH_INVITATION_TTL_SECONDS: "${AUTH_INVITATION_TTL_SECONDS:-259200}"
      AUTH_MAX_ACTIVE_SESSIONS: "${AUTH_MAX_ACTIVE_SESSIONS:-10}"
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
      RATE_LIMIT_REQUESTS: "${RATE_LIMIT_REQUESTS:-60}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      AUTH_RATE_LIMIT_REQUESTS: "${AUTH_RATE_LIMIT_REQUESTS:-10}"
      AUTH_RATE_LIMIT_WINDOW_SECONDS: "${AUTH_RATE_LIMIT_WINDOW_SECONDS:-300}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-}"
      VIDEO_ALLOWED_HOSTS: "${VIDEO_ALLOWED_HOSTS:-}"
      PUBLIC_SOURCES_ENABLED: "${PUBLIC_SOURCES_ENABLED:-true}"
      PUBLIC_SOURCES_MAX_RESULTS: "${PUBLIC_SOURCES_MAX_RESULTS:-15}"
    volumes:
      - generated-data:/app/generated
      - upload-data:/app/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  generated-data:
  upload-data:
