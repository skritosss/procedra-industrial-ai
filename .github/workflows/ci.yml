name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0 libgomp1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q app tests scripts

      - name: Lint Python files
        run: python -m ruff check app tests scripts

      - name: Typecheck application
        run: python -m mypy app scripts

      - name: Check dependency consistency
        run: python -m pip check

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt

      - name: Run tests
        env:
          OPENAI_ENABLED: "false"
        run: python -m pytest -q

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t industrial-instruction-ai:ci .

      - name: Run container smoke and restart check
        run: |
          set -euo pipefail
          trap 'docker rm -f procedra-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name procedra-ci -p 127.0.0.1:18000:8000 industrial-instruction-ai:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/ready >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then docker logs procedra-ci; exit 1; fi
            sleep 1
          done
          test "$(docker exec procedra-ci id -u)" != "0"
          curl -fsS http://127.0.0.1:18000/health
          docker restart procedra-ci >/dev/null
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/ready >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then docker logs procedra-ci; exit 1; fi
            sleep 1
          done

      - name: Validate Compose config
        run: docker compose config
