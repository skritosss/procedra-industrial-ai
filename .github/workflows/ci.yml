name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0 libgomp1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q app tests scripts

      - name: Lint Python files
        run: python -m ruff check app tests scripts

      - name: Typecheck application
        run: python -m mypy app scripts

      - name: Check dependency consistency
        run: python -m pip check

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt

      - name: Run tests
        env:
          OPENAI_ENABLED: "false"
        run: python -m pytest -q

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t industrial-instruction-ai:ci .

      - name: Refuse to start without configuration
        run: |
          set -euo pipefail
          # The image defaults to production, so an unconfigured container must
          # fail closed instead of coming up open to the internet. This asserts
          # the security property directly rather than trusting the default.
          if docker run --rm --name procedra-ci-unconfigured industrial-instruction-ai:ci; then
            echo "Container started without configuration; it must refuse to." >&2
            exit 1
          fi

      - name: Run container smoke and restart check
        run: |
          set -euo pipefail
          trap 'docker rm -f procedra-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name procedra-ci -p 127.0.0.1:18000:8000 \
            -e DEPLOYMENT_MODE=production \
            -e API_ACCESS_TOKEN=ci-production-bootstrap-token-at-least-32-chars \
            -e AUTH_PUBLIC_REGISTRATION_ENABLED=false \
            -e AUTH_ALLOW_ROLE_SELF_ASSIGNMENT=false \
            -e AUTH_MIN_PASSWORD_LENGTH=12 \
            -e VIDEO_ALLOWED_HOSTS=youtube.com \
            industrial-instruction-ai:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/ready >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then docker logs procedra-ci; exit 1; fi
            sleep 1
          done
          test "$(docker exec procedra-ci id -u)" != "0"
          curl -fsS http://127.0.0.1:18000/health
          # The internal documents must not reach a customer-delivered image.
          if docker exec procedra-ci test -e docs; then
            echo "docs/ is present in the image" >&2
            exit 1
          fi
          curl -fsS -D - -o /dev/null http://127.0.0.1:18000/health \
            | grep -qi "^strict-transport-security: max-age=31536000"
          docker restart procedra-ci >/dev/null
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/ready >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then docker logs procedra-ci; exit 1; fi
            sleep 1
          done

      - name: Validate Compose config
        run: docker compose config
